name: Publish Payment Persistence Postgres

on:
  push:
    branches: [main]
    paths:
      - 'packages/payment-persistence-postgres/**'
    tags:
      - 'payment-persistence-postgres-v*'
      - '@amirhossein-moloki/payment-persistence-postgres@*'
      - 'packages/payment-persistence-postgres/v*'
  workflow_dispatch:

concurrency:
  group: publish-payment-persistence-postgres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Test & Publish Payment Persistence Postgres
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify linter for payment-persistence-postgres
        run: pnpm --filter @amirhossein-moloki/payment-persistence-postgres lint

      - name: Build payment-persistence-postgres and required workspace dependencies
        run: pnpm --filter @amirhossein-moloki/payment-persistence-postgres... build

      - name: Run unit tests for payment-persistence-postgres
        run: pnpm --filter @amirhossein-moloki/payment-persistence-postgres test

      - name: Setup release .npmrc
        run: |
          echo "@amirhossein-moloki:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
          cp .npmrc packages/payment-persistence-postgres/.npmrc
          cp .npmrc ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Check if version is already published
        id: check-version
        working-directory: packages/payment-persistence-postgres
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Checking if $PKG_NAME@$PKG_VERSION is already published on GitHub Packages..."
          if npm view "$PKG_NAME@$PKG_VERSION" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "Version $PKG_VERSION of $PKG_NAME is already published."
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $PKG_VERSION of $PKG_NAME is NOT published yet."
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Validate and pack package
        if: steps.check-version.outputs.already_published == 'false'
        working-directory: packages/payment-persistence-postgres
        run: pnpm pack

      - name: Publish to GitHub Packages
        if: steps.check-version.outputs.already_published == 'false'
        working-directory: packages/payment-persistence-postgres
        run: pnpm publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Cleanup release .npmrc
        if: always()
        run: |
          rm -f .npmrc
          rm -f packages/payment-persistence-postgres/.npmrc
          rm -f ~/.npmrc
