name: Release Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version or tag name'
        required: false
        type: string

jobs:
  release:
    name: Dual-Registry Release (npm Private & GitHub Packages)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code formatting
        run: pnpm run format:check

      - name: Run linter
        run: pnpm lint

      - name: Build workspace packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Validate package tarballs & external consumer installation
        run: python3 scripts/validate-consumer-packages.py

      - name: Publish to npm Private Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN:-$NODE_AUTH_TOKEN}" > .npmrc
          pnpm --recursive publish --access restricted --no-git-checks
        continue-on-error: false

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@company:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN:-$NODE_AUTH_TOKEN}" >> .npmrc
          pnpm --recursive publish --registry https://npm.pkg.github.com --access restricted --no-git-checks
        continue-on-error: false

      - name: Cleanup release .npmrc
        if: always()
        run: rm -f .npmrc
