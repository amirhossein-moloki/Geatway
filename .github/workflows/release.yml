name: Release Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version or tag name'
        required: false
        type: string

jobs:
  release:
    name: GitHub Packages Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@amirhossein-moloki'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code formatting
        run: pnpm run format:check

      - name: Run linter
        run: pnpm lint

      - name: Build workspace packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Validate package tarballs & external consumer installation
        run: python3 scripts/validate-consumer-packages.py

      - name: Setup release .npmrc
        run: |
          echo "@amirhossein-moloki:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc

      - name: Publish to GitHub Packages
        working-directory: packages/payment-core
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: false

      - name: Cleanup release .npmrc
        if: always()
        run: rm -f .npmrc
