services:
  server:
    build:
      context: ../..
      dockerfile: examples/depix-test/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=development
      - USE_MOCK_GATEWAYS=false
      - PAYMENT_ENV=sandbox
      - ZIBAL_MERCHANT=zibal
      - ZIBAL_CALLBACK_URL=http://localhost:3000/api/callbacks/zibal

  test:
    build:
      context: ../..
      dockerfile: examples/depix-test/Dockerfile
    command: pnpm test
    environment:
      - NODE_ENV=test
      - USE_MOCK_GATEWAYS=false
      - PAYMENT_ENV=sandbox
      - ZIBAL_MERCHANT=zibal

  cli-test:
    build:
      context: ../..
      dockerfile: examples/depix-test/Dockerfile
    command: node dist/cli-test.js
    environment:
      - NODE_ENV=development
      - USE_MOCK_GATEWAYS=false
      - PAYMENT_ENV=sandbox
      - ZIBAL_MERCHANT=zibal
      - ZIBAL_CALLBACK_URL=http://localhost:3000/api/callbacks/zibal
